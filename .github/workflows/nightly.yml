name: nightly

# 毎月1日の朝(日本時間)に締めを行う。
# 日次にすると、それだけで月30回ぶんの分数を食う。締めは月1回で足りる。
on:
  schedule:
    - cron: "0 0 1 * *"    # UTC 毎月1日 00:00 = 日本時間 毎月1日 09:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  close-month:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 月次の締め
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOARD_ISSUE: ${{ vars.BOARD_ISSUE }}
        run: python scripts/nightly.py

      - name: 記録を残す
        run: |
          git config user.name  "ai-company[bot]"
          git config user.email "ai-company@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "月次の締め"
            git pull --rebase --autostash
            git push
          fi
